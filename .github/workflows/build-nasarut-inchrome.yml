name: Build Nasarut-inchrome

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nasarut-inchrome/**'
      - '.github/workflows/build-nasarut-inchrome.yml'

permissions:
  contents: write

concurrency:
  group: build-nasarut-inchrome
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nasarut-inchrome
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nasarut-inchrome/package-lock.json

      - name: Install exact dependencies from package-lock.json
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npx heft build --clean --production

      - name: Package solution
        run: npx heft package-solution --production

      - name: Upload .sppkg
        uses: actions/upload-artifact@v4
        with:
          name: Nasarut-inchrome-sppkg
          path: nasarut-inchrome/sharepoint/solution/nasarut-inchrome.sppkg
          if-no-files-found: error

      - name: Commit built package to dist/
        working-directory: .
        run: |
          mkdir -p dist
          cp nasarut-inchrome/sharepoint/solution/nasarut-inchrome.sppkg dist/Nasarut-inchrome.sppkg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Nasarut-inchrome.sppkg
          if git diff --cached --quiet; then
            echo "Package unchanged"
            exit 0
          fi
          git commit -m "Build Nasarut-inchrome.sppkg"
          git pull --rebase origin main
          git push origin HEAD:main
