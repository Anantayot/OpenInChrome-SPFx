name: Build SharePoint SPFx package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'custom/**'
      - '.github/workflows/build-spfx.yml'
      - 'OpenInChrome/**'
      - 'package.json'
      - 'src/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scaffold SPFx project from Microsoft generator
        shell: bash
        run: |
          npm install -g yo @microsoft/generator-sharepoint@1.22.2 @rushstack/heft
          mkdir -p build-project
          cd build-project
          CI=true yo @microsoft/sharepoint \
            --solution-name open-in-chrome \
            --component-type webpart \
            --component-name OpenInChrome \
            --component-description "Open approved links in Chrome" \
            --framework none \
            --environment spo \
            --package-manager npm \
            --skip-install \
            --no-insight

      - name: Replace web part with configurable protocol hyperlink
        shell: bash
        run: |
          find build-project -name 'package.json' -not -path '*/node_modules/*' -print
          PROJECT="$(find build-project -type f -name 'package.json' -not -path '*/node_modules/*' -printf '%h\n' | head -1)"
          if [[ -z "$PROJECT" ]]; then echo "SPFx generator did not create package.json"; exit 1; fi
          TARGET="$(find "$PROJECT/src/webparts" -name '*WebPart.ts' -print -quit)"
          if [[ -z "$TARGET" ]]; then echo "SPFx web part source missing"; exit 1; fi
          cp custom/OpenInChromeWebPart.ts "$TARGET"
          node -e 'const fs=require("fs"); const f=process.argv[1]; const j=JSON.parse(fs.readFileSync(f,"utf8")); j.solution.includeClientSideAssets=true; j.solution.skipFeatureDeployment=false; fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n")' "$PROJECT/config/package-solution.json"
          # Preserve the original .sppkg app/feature/web-part IDs for upgrades.
          # The Microsoft generator otherwise creates fresh IDs on every run.
          node -e 'const fs=require("fs");const file=process.argv[1];const j=JSON.parse(fs.readFileSync(file,"utf8"));j.solution.id="968f0272-ec25-46a0-a351-6f35299b8d24";j.solution.version="1.0.1.0";if(!Array.isArray(j.solution.features)||!j.solution.features.length)throw Error("Solution features missing");j.solution.features[0].id="920d0ed3-0a19-41e4-9d44-82c40c02cc02";fs.writeFileSync(file,JSON.stringify(j,null,2))' "$PROJECT/config/package-solution.json"
          node -e 'const fs=require("fs"),path=require("path");const dir=path.dirname(process.argv[1]);const name=fs.readdirSync(dir).find(x=>x.endsWith(".manifest.json"));if(!name)throw Error("Webpart manifest missing");const file=path.join(dir,name);const j=JSON.parse(fs.readFileSync(file,"utf8").replace(/^\\s*\\/\\/.*$/gm,"").replace(/,\\s*([}\\]])/g,"$1"));j.id="73c11d0c-7e55-4775-9239-79164c999041";fs.writeFileSync(file,JSON.stringify(j,null,2)+"\\n")' "$TARGET"
          echo "$PROJECT" > project-directory.txt

      - name: Install and compile
        shell: bash
        run: |
          cd "$(cat project-directory.txt)"
          npm install --no-audit --no-fund
          npx heft build --production
          npx heft package-solution --production

      - name: Upload .sppkg
        uses: actions/upload-artifact@v4
        with:
          name: OpenInChrome-sppkg
          path: build-project/**/sharepoint/solution/*.sppkg
          if-no-files-found: error

      - name: Commit built package to repository
        shell: bash
        run: |
          mkdir -p dist
          PACKAGE="$(find build-project -type f -path '*/sharepoint/solution/*.sppkg' -print -quit)"
          test -n "$PACKAGE"
          cp "$PACKAGE" dist/OpenInChrome.sppkg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/OpenInChrome.sppkg
          if ! git diff --cached --quiet; then
            git commit -m "Store latest built OpenInChrome .sppkg"
            git push origin HEAD:main
          else
            echo "Built package already saved in repository"
          fi
