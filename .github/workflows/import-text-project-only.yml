name: Import OpenInChromeText project unchanged

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-text-project-only.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract only the original project files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256

          archive = Path('OpenInChromeText-repo-files.zip')
          assert archive.is_file(), 'Original ZIP missing'
          with ZipFile(archive) as z:
              paths = [info for info in z.infolist() if not info.is_dir()]
              selected = [info for info in paths if info.filename.startswith('open-in-chrome-text/')]
              assert selected, 'Project folder missing from ZIP'
              required = {
                  'open-in-chrome-text/package-lock.json',
                  'open-in-chrome-text/package.json',
                  'open-in-chrome-text/.eslintrc.js',
                  'open-in-chrome-text/.gitignore',
                  'open-in-chrome-text/.npmignore',
                  'open-in-chrome-text/.yo-rc.json',
                  'open-in-chrome-text/.vscode/launch.json',
                  'open-in-chrome-text/.vscode/settings.json',
              }
              existing = {x.filename for x in selected}
              assert required <= existing, 'Required project file missing: ' + repr(required-existing)
              assert len(existing) == len(selected), 'Duplicate ZIP entry'
              for info in selected:
                  filename=info.filename
                  target=Path(filename)
                  assert '..' not in target.parts and '\\' not in filename and not target.is_absolute(), 'Unsafe path: ' + filename
                  assert not target.exists(), 'Refusing to replace existing repo path: ' + filename
                  target.parent.mkdir(parents=True,exist_ok=True)
                  payload=z.read(info)
                  target.write_bytes(payload)
                  assert target.read_bytes()==payload, 'Unchanged extraction check failed: ' + filename
                  print(filename, sha256(payload).hexdigest())
              print('Imported', len(selected), 'ZIP files without modification')
          PY

      - name: Commit only new project folder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f open-in-chrome-text/
          git diff --cached --name-only | grep -v '^open-in-chrome-text/' && { echo 'Unexpected staged path'; exit 1; } || true
          git diff --cached --name-only
          git commit -m "Add Text (Open in Chrome) SPFx web part"
          git push origin HEAD:main
